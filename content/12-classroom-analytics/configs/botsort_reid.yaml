# BoT-SORT + ReID, tuned for a fixed classroom camera.
#
# The room is static, students are mostly seated, and they occlude each other
# constantly as people walk between the desks. Every value that differs from the
# Ultralytics default is marked, with the reason.
#
# Docs: https://docs.ultralytics.com/modes/track

tracker_type: botsort

track_high_thresh: 0.20   # default 0.25 -> LOWER, not higher. Measured on this
                          # footage, YOLO11-nano puts only ~1.3 boxes per frame
                          # above 0.55 while the room holds 5 people. Raising
                          # this threshold does not clean up the output, it
                          # deletes the back rows.
track_low_thresh: 0.08    # the second association stage deliberately keeps weak
                          # boxes: that is what recovers a half-occluded student
new_track_thresh: 0.25    # start a track from a modest detection and let
                          # min_hits (app.yaml) decide what counts as a student.
                          # Temporal persistence filters noise far better than a
                          # confidence bar the nano model cannot clear.
track_buffer: 150         # default 30 -> ~7s at 20fps. A student can be hidden
                          # behind a classmate for that long and keep their ID
match_thresh: 0.85        # default 0.8 -> slightly more permissive matching,
                          # because a seated student's box barely moves
fuse_score: True

gmc_method: none          # default sparseOptFlow. The camera is bolted to the
                          # wall, so global motion compensation only costs time.
                          # Switch back to sparseOptFlow for a handheld camera.

with_reid: True           # default False -> appearance matching. THE defence
                          # against two students swapping IDs when they cross
model: auto               # reuses the detector's own features - no extra weights
proximity_thresh: 0.5
appearance_thresh: 0.8    # deliberately strict: school uniforms look alike, so
                          # a weak appearance match must not override geometry
