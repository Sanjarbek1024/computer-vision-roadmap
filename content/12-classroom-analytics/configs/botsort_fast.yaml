# BoT-SORT without ReID - the automatic fallback and the "my laptop is slow"
# option. Same thresholds as botsort_reid.yaml so a comparison between the two
# isolates one variable: appearance matching on vs off.
#
# Expect more ID switches when students cross in front of each other. The
# registry's own re-identification layer (registry.py) absorbs some of that,
# but not all of it.

tracker_type: botsort

track_high_thresh: 0.20
track_low_thresh: 0.08
new_track_thresh: 0.25
track_buffer: 150
match_thresh: 0.85
fuse_score: True

gmc_method: none

with_reid: False
model: auto
proximity_thresh: 0.5
appearance_thresh: 0.8
