# ByteTrack — same buffer/thresholds as botsort_reid.yaml so a later comparison
# isolates the real difference (motion+ReID vs motion-only), not mismatched tuning.

tracker_type: bytetrack

track_high_thresh: 0.4
track_low_thresh: 0.1
new_track_thresh: 0.6
track_buffer: 90
match_thresh: 0.8
fuse_score: True
